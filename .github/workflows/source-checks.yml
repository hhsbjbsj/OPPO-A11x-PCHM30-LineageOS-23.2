name: Validate source patch baseline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r tools/requirements-validation.txt
      - run: python tools/fetch_baseline_files.py
      - run: python tools/generate_patches.py
      - run: git diff --exit-code -- PATCHSET.json patches
      - run: python tools/validate_patchset.py
      - run: python tools/test_backup_paths.py
      - run: python tools/test_freeze_cnb.py
      - run: python tools/test_source_guards.py
      - run: bash -n build.sh
